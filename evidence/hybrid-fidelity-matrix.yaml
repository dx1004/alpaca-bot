    source_ids: [SMB_SIZING_2013]
    equivalence_evidence: null
    engineering_basis: null
    blocking_reason: Dollar/percentage threshold, realized/unrealized accounting, reset time and open-position handling are unspecified.
  - rule_id: HYBRID_STOP_TRADING_001
    version_id: HYBRID_500_IEX_CANDIDATE_V1
    domain: STOP_TRADING
