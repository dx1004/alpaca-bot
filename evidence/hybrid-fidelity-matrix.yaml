    source_ids: [SMB_ADT_ENTRY_2020, AZIZ_TSLL_RECAP_2025]
    equivalence_evidence: null
    engineering_basis: null
    blocking_reason: No complete partial, target, trailing, re-entry and end-of-session precedence policy is sourced for $500 or fractional shares.
  - rule_id: HYBRID_DAILY_LIMIT_001
    version_id: HYBRID_500_IEX_CANDIDATE_V1
    domain: DAILY_LIMIT
