    source_ids: [HUMBLED_DIP_2026, AZIZ_TSLL_RECAP_2025]
    equivalence_evidence: null
    engineering_basis: null
    blocking_reason: Structural level selection, trigger timing, offset, order protection and partial-fill handling are not specified for one selected setup and Alpaca session.
  - rule_id: HYBRID_EXIT_001
    version_id: HYBRID_500_IEX_CANDIDATE_V1
    domain: EXIT
    fidelity: BLOCKED_RESEARCH
