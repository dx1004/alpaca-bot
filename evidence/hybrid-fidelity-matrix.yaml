rules:
  - rule_id: HYBRID_SCREENING_001
    version_id: HYBRID_500_IEX_CANDIDATE_V1
    domain: SCREENING
    fidelity: BLOCKED_RESEARCH
    statement: Public examples use different daily-support and opening-drive stock-selection contexts.
    source_ids: [HUMBLED_DIP_2026, SMB_ADT_ENTRY_2020, AZIZ_MIXED_RECAP_2023]
    equivalence_evidence: null
    engineering_basis: null
    blocking_reason: No single source defines a compatible automatic $500 IEX-only candidate universe; full-market discovery cannot be inferred from a 30-symbol IEX stream.
  - rule_id: HYBRID_RVOL_001
    version_id: HYBRID_500_IEX_CANDIDATE_V1
    domain: RELATIVE_VOLUME
    fidelity: BLOCKED_RESEARCH
    statement: The SMB ADT case discusses elevated relative volume.
    source_ids: [SMB_ADT_ENTRY_2020]
    equivalence_evidence: null
    engineering_basis: null
    blocking_reason: A compatible indicator numerator, baseline, time window and IEX-only interpretation are not specified for this hybrid candidate.
  - rule_id: HYBRID_NEWS_001
    version_id: HYBRID_500_IEX_CANDIDATE_V1
    domain: NEWS
    fidelity: BLOCKED_RESEARCH
    statement: The reviewed traders discuss catalysts in different setup contexts.
    source_ids: [HUMBLED_DIP_2026, SMB_ADT_ENTRY_2020, AZIZ_MIXED_RECAP_2023]
    equivalence_evidence: null
    engineering_basis: null
    blocking_reason: No unified, point-in-time catalyst-quality, freshness, revision and source-health rule is supported for automatic selection.
  - rule_id: HYBRID_ENTRY_001
    version_id: HYBRID_500_IEX_CANDIDATE_V1
    domain: ENTRY
    fidelity: BLOCKED_RESEARCH
    statement: Humbled Trader describes daily-support dip entries; SMB and Aziz examples concern opening-drive or opening-range entries.
    source_ids: [HUMBLED_DIP_2026, SMB_ADT_ENTRY_2020, AZIZ_TSLL_RECAP_2025]
    equivalence_evidence: null
    engineering_basis: null
    blocking_reason: These are distinct setups and cannot be merged into one automated trigger; support tolerance, intrabar timing and required depth observations remain undefined.
  - rule_id: HYBRID_ADDS_001
    version_id: HYBRID_500_IEX_CANDIDATE_V1
    domain: ADDS
    fidelity: BLOCKED_RESEARCH
    statement: The cited cases mention additions or staged buying in different contexts.
    source_ids: [HUMBLED_DIP_2026, SMB_ADT_ENTRY_2020, AZIZ_TSLL_RECAP_2025]
    equivalence_evidence: null
    engineering_basis: null
    blocking_reason: No compatible automatic add trigger, exposure ceiling or stop update exists for a $500 long-only 1x account; TSLL is a leveraged ETF example.
  - rule_id: HYBRID_RISK_001
    version_id: HYBRID_500_IEX_CANDIDATE_V1
    domain: RISK
    fidelity: BLOCKED_RESEARCH
    statement: SMB's numeric suggestion uses a preexisting intraday loss allowance, not account equity.
    source_ids: [SMB_SIZING_2013, HUMBLED_DIP_2026]
    equivalence_evidence: null
    engineering_basis: null
    blocking_reason: Neither a $500 daily allowance nor a complete per-trade risk and buying-power rule is sourced for this candidate; do not convert 30 percent of an undefined allowance to 30 percent of equity.
  - rule_id: HYBRID_STOPS_001
    version_id: HYBRID_500_IEX_CANDIDATE_V1
    domain: STOPS
    fidelity: BLOCKED_RESEARCH
