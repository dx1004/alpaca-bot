[project]
name = "alpaca-ross-bot"
version = "0.1.0"
description = "Evidence-first, paper-only Ross Cameron strategy research for Alpaca"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alpaca-py==0.44.0",
    "pyyaml==6.0.3",
    "websockets==17.1",
]

[build-system]
requires = ["uv_build==0.12.17"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy==2.3.1",
    "pytest==9.1.1",
    "ruff==0.16.9",
    "types-pyyaml==6.0.12.20260906",
]

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
